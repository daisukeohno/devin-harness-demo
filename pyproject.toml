[project]
name = "sensor-analytics"
version = "0.1.0"
description = "Sensor time-series analysis service used as a Devin harness demo"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.6",
    "pandas==2.2.3",
    "uvicorn==0.34.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.4",
    "ruff==0.8.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sensor_analytics"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
